name: Terraform Apply
description: Apply changes in a terraform module
author: Dan Drew

inputs:
  path:
    default: '.'
    required: false
    description: 'Path to module to apply. Default is root of the workspace. A path with a terragrunt.hcl is applied with Terragrunt.'
  terraform_version:
    default: ''
    required: false
    description: 'Provide Terraform version if not using a .tool-versions files. Terragrunt units also need terragrunt in .tool-versions.'
  targets:
    default: ''
    required: false
    description: 'Restrict apply to selected targets'
  workspace:
    default: 'default'
    required: false
    description: 'Terraform workspace to apply'

runs:
  using: composite
  steps:
    - if: ${{ inputs.terraform_version != '' }}
      shell: bash
      run: echo "terraform ${{ inputs.terraform_version }}" > '${{ inputs.path }}/.tool-versions'

    - uses: dan-drew/asdf-actions/tool-versions@v1
      with:
        dir: ${{ inputs.path }}
    - uses: dan-drew/asdf-actions/install@v1

    - shell: bash
      run: |
        set -x
        readonly target_names='${{ inputs.targets }}'

        # A Terragrunt unit has a terragrunt.hcl; anything else is a plain Terraform module
        declare -a tool=("terraform")
        if [[ -f '${{ inputs.path }}/terragrunt.hcl' ]]; then
          tool=("terragrunt" "run" "--")   # Terragrunt 1.x runs Terraform commands through run
          if ! command -v terragrunt >/dev/null; then
            echo '::error::${{ inputs.path }} is a Terragrunt unit, but terragrunt is not installed. Add it to .tool-versions'
            exit 1
          fi
        fi

        declare -a plan_cmd=("${tool[@]}" "plan" "-input=false" "-detailed-exitcode" "-out=tfplan")
        declare -a apply_cmd=("${tool[@]}" "apply" "-auto-approve" "-input=false" "tfplan")

        for target in $target_names; do
          plan_cmd+=("-target" "${target}")
        done

        export TF_IN_AUTOMATION=1

        echo '::group::Initializing'
        cd '${{ inputs.path }}'
        "${tool[@]}" init -input=false
        "${tool[@]}" workspace select ${{ inputs.workspace }}
        echo '::endgroup::'

        echo '::group::Applying'
        if "${plan_cmd[@]}"; then
          echo '::notice::No changes to apply'
        elif [[ "$?" == "2" ]]; then
          "${apply_cmd[@]}"
        else
          echo '::error::Terraform failed trying to generate a plan'
          exit 1
        fi
        echo '::endgroup::'
